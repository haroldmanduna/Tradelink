# Render Blueprint for TradeLink (single web service).
# Database is hosted on Supabase (Postgres) — DATABASE_URL is set in the Render
# dashboard/API and is intentionally NOT managed by this blueprint (sync: false),
# so a blueprint re-sync can never overwrite the Supabase connection string.

services:
  - type: web
    name: tradelink
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20.11.1"

