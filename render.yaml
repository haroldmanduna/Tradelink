# Render Blueprint for TradeLink (single web service + managed Postgres).
# Deploy: push to GitHub, then in Render "New +" -> "Blueprint" and pick this repo.
databases:
  - name: tradelink-db
    plan: free
    databaseName: tradelink
    user: tradelink

services:
  - type: web
    name: tradelink
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradelink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20.11.1"
